name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.1", "2026.9.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/checkout@v4
        with:
          repository: Paskooter/ha-conversation-jev
          ref: v0.3.0b1
          path: jev-fork
      - run: python -m pip install homeassistant==${{ matrix.homeassistant }} -r requirements-test.txt -r requirements-controls.txt -r requirements-conversation-${{ matrix.homeassistant }}.txt -r jev-fork/requirements-dev.txt
      - run: node --check tests/direct_node_backend.cjs
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest -q -s
        env:
          JEV_PROJECT_DIR: ${{ github.workspace }}/jev-fork
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
