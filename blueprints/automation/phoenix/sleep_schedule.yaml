blueprint:
  name: Jibo — sleep and wake on a schedule
  description: >-
    Put Jibo to sleep and wake him at two chosen times, in Home Assistant's time
    zone. Enable sleep controls in Phoenix → Configure, then select his Sleep
    switch. Selected weekdays apply independently to each event. Offline or busy
    commands are skipped; a missed time is never replayed after reconnect or
    restart. Choose different sleep and wake times.
  domain: automation
  author: Phoenix
  homeassistant:
    min_version: 2026.8.1
  source_url: https://github.com/Paskooter/phoenix-home-assistant/blob/main/blueprints/automation/phoenix/sleep_schedule.yaml
  input:
    sleep_entity:
      name: Jibo sleep switch
      selector:
        entity:
          filter:
            integration: phoenix
            domain: switch
    sleep_time:
      name: Sleep at
      default: "22:00:00"
      selector:
        time: {}
    wake_time:
      name: Wake at
      default: "08:00:00"
      selector:
        time: {}
    weekdays:
      name: Days
      description: Each sleep or wake event uses its own day of the week.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}

mode: single
max_exceeded: silent
variables:
  sleep_entity: !input sleep_entity
  sleep_time: !input sleep_time
  wake_time: !input wake_time
triggers:
  - trigger: time
    id: sleep
    at: !input sleep_time
  - trigger: time
    id: wake
    at: !input wake_time
conditions:
  - condition: time
    weekday: !input weekdays
  - condition: template
    value_template: >-
      {{ states(sleep_entity) in ['on', 'off']
         and today_at(sleep_time) != today_at(wake_time) }}
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: sleep
          - condition: state
            entity_id: !input sleep_entity
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input sleep_entity
      - conditions:
          - condition: trigger
            id: wake
          - condition: state
            entity_id: !input sleep_entity
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input sleep_entity
